# EasyNavigation starter parameters generated by RobotLens. Edit freely; RobotLens
# never rewrites this file without keeping a backup.

system_node:
  ros__parameters:
    use_sim_time: true
    use_cmd_vel_stamped: false
    tf_prefix: ""
    map_frame: "map"
    odom_frame: "odom"
    robot_frame: "base_link"
    robot_footprint_frame: "base_footprint"
    position_tolerance: 0.1
    angle_tolerance: 0.1

sensors_node:
  ros__parameters:
    use_sim_time: true
    forget_time: 0.5
    perception_default_frame: "odom"
    sensors: [lidar]
    lidar:
      topic: "/virtual_lidar2d/scan"
      type: sensor_msgs/msg/LaserScan

localizer_node:
  ros__parameters:
    use_sim_time: true
    localizer_types: [fusion]
    fusion:
      rt_freq: 50.0
      freq: 5.0
      reseed_freq: 0.1
      latitude_origin: 0.0
      longitude_origin: 0.0
      altitude_origin: 0.0
      plugin: easynav_fusion_localizer/FusionLocalizer
      global_filter:
        two_d_mode: true
        publish_tf: true
        map_frame: "map"
        odom_frame: "odom"
        base_link_frame: "base_footprint"
        world_frame: "map"
        odom0: "/odom"
        odom0_config: [true,  true,  false,
                       false, false, true,
                       true,  true,  false,
                       false, false, true,
                       false, false, false]
        odom0_differential: false

maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [simple]
    simple:
      freq: 10.0
      plugin: easynav_costmap_maps_manager/CostmapMapsManager
      package: ""
      map_path_file: ""
      filters: [obstacles, inflation]
      obstacles:
        plugin: easynav_costmap_maps_manager/CostmapMapsManager/ObstaclesFilter
      inflation:
        plugin: easynav_costmap_maps_manager/CostmapMapsManager/InflationFilter
        inscribed_radius: 0.35
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [simple]
    simple:
      freq: 5.0
      plugin: easynav_costmap_planner/CostmapPlanner
      cost_factor: 0.01
      continuous_replan: true

controller_node:
  ros__parameters:
    use_sim_time: true
    colision_checker:
      active: true
      robot_radius: 0.3
      brake_acc: 0.5
      safety_margin: 0.05
    controller_types: [simple]
    simple:
      rt_freq: 30.0
      plugin: easynav_simple_controller/SimpleController
      max_linear_speed: 0.5
      max_angular_speed: 1.0
      max_linear_acc: 0.5
      max_angular_acc: 1.0
      look_ahead_dist: 0.3
      linear_kp: 0.8
      linear_ki: 0.0
      linear_kd: 0.0
      angular_kp: 0.5
      angular_ki: 0.0
      angular_kd: 0.0
      k_rot: 2.0
      tolerance_dist: 0.05
      final_goal_angle_tolerance: 0.1
