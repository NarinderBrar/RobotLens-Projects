# Nav2 parameters for the pr2_classic demo.
#
# Layout follows the standard ros-jazzy-nav2-bringup nav2_params.yaml so
# bringup_launch.py can load it as-is. Two pr2-specific choices:
#
#   - robot_base_frame is base_footprint (PR2's URDF root link).
#   - AMCL, costmap obstacle layers, and the DWB local planner all subscribe
#     to /scan, which this fixture does not publish (PR2's physics world has
#     no bridged lidar). That is intentional: Nav2 stays fully up and
#     lifecycle-active with empty costmaps for the tool test. Bridge a
#     gz-sim lidar as /scan and it will start seeing obstacles, and then
#     remove the static map->odom identity transform in the launch file
#     (see README.md) so AMCL can own that transform.
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: differential
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: pr2_classic_map.yaml

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
      smooth_path: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      Oscillation.scale: 0.01
      Oscillation.oscillation_reset_dist: 0.05

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    max_velocities: ["linear.x: 0.5", "linear.y: 0.0", "angular.z: 1.0"]
    min_velocities: ["linear.x: -0.5", "linear.y: 0.0", "angular.z: -1.0"]
    max_accel: ["linear.x: 2.5", "linear.y: 0.0", "angular.z: 3.2"]
    max_decel: ["linear.x: -2.5", "linear.y: 0.0", "angular.z: -3.2"]
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"
    feedback: "OPEN_LOOP"

collision_monitor_node:
  ros__parameters:
    use_sim_time: true
    base_frame: base_footprint
    odom_frame: odom
    transform_tolerance: 0.2
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["footprint"]
    footprint:
      type: polygon
      points: [0.35, 0.33, 0.35, -0.33, -0.35, -0.33, -0.35, 0.33]
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan
      min_points: 2
      max_points: 1000

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "back_up", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    back_up:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["precise_goal_checker"]
    plugins: ["nav2_navigate_to_pose_bt_node",
              "nav2_navigate_through_poses_bt_node",
              "nav2_compute_path_to_pose_bt_node",
              "nav2_compute_path_through_poses_bt_node",
              "nav2_follow_path_bt_node",
              "nav2_back_up_bt_node",
              "nav2_drive_on_heading_bt_node",
              "nav2_wait_bt_node",
              "nav2_spin_bt_node",
              "nav2_goal_reached_bt_node",
              "nav2_goal_updated_bt_node",
              "nav2_initial_pose_received_bt_node",
              "nav2_recovery_node",
              "nav2_pipeline_sequence_bt_node",
              "nav2_round_robin_node",
              "nav2_distance_controller_bt_node",
              "nav2_rate_controller_bt_node",
              "nav2_reinitialize_global_localization_service_bt_node",
              "nav2_clear_costmap_service_bt_node",
              "nav2_is_stuck_bt_node",
              "nav2_is_path_valid_bt_node",
              "nav2_would_a_controller_recover_bt_node",
              "nav2_remove_passed_goals_bt_node",
              "nav2_graceful_approach_controller_bt_node"]
    goal_checkers:
      precise_goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.25
        stateful: true
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_bt_xml_filename: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_bt_node
      - nav2_compute_path_through_poses_bt_node
      - nav2_follow_path_bt_node
      - nav2_back_up_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_wait_bt_node
      - nav2_spin_bt_node
      - nav2_goal_reached_bt_node
      - nav2_goal_updated_bt_node
      - nav2_initial_pose_received_bt_node
      - nav2_recovery_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node
      - nav2_distance_controller_bt_node
      - nav2_rate_controller_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_bt_node
      - nav2_is_path_valid_bt_node
      - nav2_would_a_controller_recover_bt_node
      - nav2_remove_passed_goals_bt_node
      - nav2_graceful_approach_controller_bt_node

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.55
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_voxel_grid_layer::VoxelGridLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True
      robots_rendering_offsets: 1.0
      footprint: "[[0.35, 0.33], [0.35, -0.33], [-0.35, -0.33], [-0.35, 0.33]]"

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: false
      resolution: 0.05
      robot_radius: 0.55
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True
      robots_rendering_offsets: 1.0
      footprint: "[[0.35, 0.33], [0.35, -0.33], [-0.35, -0.33], [-0.35, 0.33]]"
